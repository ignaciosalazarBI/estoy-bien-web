<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>Estoy Bien · Invitación</title>
<style>
  :root{--bg:#fff;--fg:#111;--muted:#555;--ok:#0a6b2d;--no:#8a1c1c;--card:#f3f4f6}
  @media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--fg:#f5f5f5;--muted:#bbb;--ok:#3ecf73;--no:#ff7a7a;--card:#1c1c1c}}
  body{margin:0;background:var(--bg);color:var(--fg);font:20px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:560px;margin:0 auto;padding:24px 16px}
  h1{font-size:30px;line-height:1.2;margin:8px 0 16px}
  .card{background:var(--card);border-radius:16px;padding:20px;margin:16px 0}
  button{display:block;width:100%;min-height:64px;margin:12px 0;border:0;border-radius:14px;font:700 22px system-ui;cursor:pointer}
  .yes{background:var(--ok);color:#fff}.nope{background:transparent;color:var(--no);border:2px solid var(--no)}
  small{color:var(--muted)}
</style>
</head>
<body><main id="app"><p>Cargando…</p></main>
<script src="../config.js"></script>
<script>
const T = {
  es: { title: n => `${n} te eligió como contacto de emergencia`,
        body: n => `Si ${n} deja de usar su teléfono por el tiempo que definió, o presiona su botón de pánico, te enviaremos un mensaje con su última ubicación, batería y datos útiles para ayudarle.`,
        what: "Solo recibirás mensajes en una emergencia (y una prueba ocasional). Puedes dejar de ser contacto cuando quieras.",
        yes: "Acepto ser contacto de emergencia", no: "No puedo aceptar",
        accepted: n => `¡Gracias! Ahora eres contacto de emergencia de ${n}.`, declined: "Entendido. No recibirás mensajes.",
        invalid: "Este enlace no es válido o expiró.", privacy: "Tus datos (nombre y teléfono) solo se usan para avisarte en una emergencia. Ley 19.628." },
  en: { title: n => `${n} chose you as an emergency contact`,
        body: n => `If ${n} stops using their phone for the time they set, or presses their panic button, we'll text you their last location, battery and useful details.`,
        what: "You'll only get messages in an emergency (and an occasional test). You can opt out anytime.",
        yes: "I accept", no: "I can't accept",
        accepted: n => `Thank you! You're now ${n}'s emergency contact.`, declined: "Understood. You won't receive messages.",
        invalid: "This link is invalid or expired.", privacy: "Your name and phone are only used to alert you in an emergency." },
};
const token = location.hash.slice(1);
const app = document.getElementById('app');
const api = (body) => fetch(ESTOYBIEN.apiUrl, { method: 'POST',
  headers: { 'Content-Type': 'application/json', apikey: ESTOYBIEN.anonKey }, body: JSON.stringify({ ...body, token }) })
  .then(r => r.ok ? r.json() : null).catch(() => null);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

(async () => {
  const d = await api({ action: 'invite_get' });
  const t = T[(d && d.locale) || (navigator.language.startsWith('en') ? 'en' : 'es')];
  if (!d) { app.innerHTML = `<h1>${t.invalid}</h1>`; return; }
  document.documentElement.lang = d.locale;
  const name = esc(d.user_name || '—');
  const render = (status) => {
    if (status === 'accepted') { app.innerHTML = `<h1>✅ ${t.accepted(name)}</h1>`; return; }
    if (status === 'declined') { app.innerHTML = `<h1>${t.declined}</h1><button class="yes" id="y">${t.yes}</button>`;
      document.getElementById('y').onclick = () => answer(true); return; }
    app.innerHTML = `<h1>${t.title(name)}</h1><div class="card"><p>${t.body(name)}</p><p>${t.what}</p></div>
      <button class="yes" id="y">${t.yes}</button><button class="nope" id="n">${t.no}</button><small>${t.privacy}</small>`;
    document.getElementById('y').onclick = () => answer(true);
    document.getElementById('n').onclick = () => answer(false);
  };
  const answer = async (accept) => { const r = await api({ action: 'invite_respond', accept }); if (r && r.ok) render(r.status); };
  render(d.status);
})();
</script>
</body></html>
